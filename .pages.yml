media:
  input: assets/uploads
  output: /assets/uploads
content:
- name: press
  label: Press & Media
  type: collection
  path: content/press
  filename: '{primary}.md'
  view:
    fields:
    - title
    - publication
    - date
    primary: title
  fields:
  - name: title
    label: Article headline
    description: Appears on The Project page and in the automatic homepage press feature.
    type: string
    required: true
  - name: publication
    label: Publication or outlet
    description: The publisher name shown above the article headline.
    type: string
  - name: date
    label: Publication date
    description: Used to sort articles and determine when they rotate off the homepage.
    type: date
  - name: summary
    label: Short description
    description: Appears below the headline and in the homepage feature. Keep it brief.
    type: text
  - name: logo
    label: Publication logo (optional override)
    type: image
    description: Preferred over thumbnails and automatic logos. Leave empty to use automatic detection.
  - name: image
    label: Article thumbnail (optional override)
    type: image
    description: Used if no custom publication logo is supplied. Leave empty for automatic logo detection.
  - name: url
    label: Link to article / recording
    description: The external page opened when visitors select this feature.
    type: string
  - name: link_label
    label: Link text (optional)
    type: string
  - name: hide_image
    label: Hide image for this article
    type: boolean
    default: false
    description: Hides the logo/thumbnail for this article even when images are enabled on The Project page.
  - name: homepage_feature
    label: Allow this article to appear automatically on homepage
    type: boolean
    default: true
  - name: homepage_days
    label: Homepage feature duration (days, optional override)
    type: number
    description: Leave blank to use the homepage default (90 days).
  - name: homepage_until
    label: Keep featured until this date (optional)
    type: date
    description: Overrides the automatic expiration date for this article.
  - name: published
    label: Publish this press item
    description: Turn off to hide this item from all public press sections.
    type: boolean
    default: true
- name: people
  label: Portraits & biographies
  type: collection
  path: content/people
  filename: '{primary}.md'
  view:
    fields:
    - name
    - years
    primary: name
  fields:
  - name: name
    label: Person name
    type: string
    required: true
  - name: years
    label: Life dates
    type: string
  - name: homepage_teaser
    label: Homepage teaser (100–200 characters)
    type: text
    description: Short text shown when this person is the latest portrait. Keep to about 100–200 characters.
  - name: homepage_override
    label: Manually feature this person on homepage (optional)
    type: boolean
    default: false
    description: Normally the newest edited/published biography appears automatically. Check this to force a person
      instead; uncheck to return to automatic. If multiple are checked, the most recently edited one wins.
  - name: artworks
    label: Paintings (add one or more below)
    type: object
    list: true
    fields:
    - name: image
      label: Artwork image
      type: image
      required: true
    - name: medium
      label: Materials
      type: string
    - name: dimensions
      label: Size
      type: string
    - name: published
      label: Published
      type: boolean
      default: true
    - name: display_order
      label: Gallery position (lower numbers first)
      type: number
      default: 100
    - name: gallery_thumbnail
      label: Gallery thumbnail (optional square image)
      type: image
      description: Used only in the Portraits gallery. Leave empty to use the artwork image.
  - name: body
    label: Biography
    type: rich-text
  - name: sources
    label: Further reading & sources
    type: rich-text
  - name: special_thanks
    label: Special thanks & acknowledgments
    type: rich-text
- name: settings_global
  label: Branding & Global
  type: file
  path: content/settings/global.yml
  fields:
  - name: logo
    label: Logo
    type: image
  - name: logo_width
    label: Logo Width
    type: number
  - name: favicon
    label: Favicon (square PNG recommended)
    type: image
  - name: accent_color
    label: Accent Color
    type: string
  - name: text_color
    label: Base text color (fallback)
    type: string
  - name: page_background
    label: Page Background
    type: string
  - name: button_color
    label: Button Color
    type: string
  - name: button_text_color
    label: Button Text Color
    type: string
  - name: content_width
    label: Content Width
    type: number
  - name: section_spacing
    label: Section Spacing
    type: number
- name: settings_header
  label: Header & Navigation
  type: file
  path: content/settings/header.yml
  fields:
  - name: navigation
    label: Navigation menu items
    type: object
    list: true
    fields:
    - name: label
      label: Menu label
      type: string
    - name: url
      label: Link
      type: string
  - name: interior_header_height
    label: Desktop page header height (px)
    type: number
    default: 350
    description: Height of interior page headers with artwork. Try 300, 350, or 400. Mobile adjusts automatically.
  - name: nav_background
    label: Nav Background
    type: string
  - name: nav_text_color
    label: Nav Text Color
    type: string
  - name: nav_font
    label: Nav Font
    type: select
    options:
      values: &id001
      - Barlow Condensed
      - DM Sans
      - Caveat
      - Anton
      - Archivo Black
      - Oswald
      - Bebas Neue
      - Manrope
      - Montserrat
      - Outfit
      - Work Sans
      - Libre Baskerville
      - Playfair Display
      - Cormorant Garamond
      - Merriweather
      - Inter
      - Source Sans 3
      - Lato
      - Nunito Sans
      - Roboto
      - Poppins
      - Roboto Slab
      - Lora
      - Space Grotesk
      - Barlow
      - Archivo
  - name: nav_font_size
    label: Nav Font Size
    type: number
    description: Size of menu links, not the main page title.
  - name: nav_weight
    label: Navigation weight (400–900)
    type: number
  - name: nav_tracking
    label: Navigation letter spacing (px)
    type: number
  - name: nav_gap
    label: Nav Gap
    type: number
  - name: nav_rule_type
    label: Navigation bottom rule type
    type: select
    options:
      values:
      - solid
      - gradient
  - name: nav_rule_color
    label: Navigation rule start color
    type: string
  - name: nav_rule_end
    label: Navigation rule end color
    type: string
  - name: nav_rule_width
    label: Navigation rule thickness
    type: number
  - name: social_icon_gap
    label: Social icon spacing (px)
    type: number
    description: Space between icons in both header and footer.
  - name: social_icon_mobile_gap
    label: Social icon spacing on small screens (px)
    type: number
- name: settings_typography
  label: Typography
  type: file
  path: content/settings/typography.yml
  fields:
  - name: heading_font
    label: Fallback heading font (used when no specific heading font is set)
    type: select
    options:
      values: *id001
  - name: body_font
    label: Body Font
    type: select
    options:
      values: *id001
  - name: body_size
    label: Body text and biographies size (px)
    type: number
    description: Regular paragraph text throughout the site.
  - name: body_weight
    label: Body text and biographies weight (400–900)
    type: number
  - name: body_leading
    label: Body line height (e.g. 1.75)
    type: number
  - name: paragraph_spacing
    label: Paragraph spacing (px) - regular page content
    type: number
    description: Space after each paragraph on editorial pages.
  - name: section_heading_spacing
    label: Space above section headings (px) - regular page content
    type: number
    description: Space above H2 and H3 headings on editorial pages.
  - name: body_color
    label: Body text color (overrides base text color)
    type: string
  - name: page_title_line_height
    label: Page title line height (e.g. 1.05)
    type: number
    default: 1.05
    description: Spacing between lines when an interior page title wraps.
  - name: page_tagline_line_height
    label: Page tagline line height (e.g. 1.15)
    type: number
    default: 1.15
    description: Spacing between lines of the handwritten tagline in interior page headers.
  - name: display_font
    label: Page headings font
    type: select
    options:
      values: *id001
  - name: display_size
    label: Page headings size (px)
    type: number
    description: Large page titles such as The Project or a person’s name.
  - name: display_mobile_size
    label: Page heading mobile size (px)
    type: number
  - name: display_weight
    label: Page headings weight (400–900)
    type: number
  - name: display_tracking
    label: Page headings letter spacing (px)
    type: number
  - name: heading_color
    label: Page headings color (hex)
    type: string
  - name: section_font
    label: Section headings font
    type: select
    options:
      values: *id001
  - name: section_size
    label: Section headings size (px)
    type: number
    description: Headings within page content, not research-box headings.
  - name: section_weight
    label: Section headings weight (400–900)
    type: number
  - name: section_color
    label: Section headings color (hex)
    type: string
  - name: label_font
    label: Small labels font
    type: select
    options:
      values: *id001
  - name: label_size
    label: Small labels size (px)
    type: number
  - name: label_weight
    label: Small labels weight (400–900)
    type: number
  - name: label_tracking
    label: Small labels letter spacing (px)
    type: number
  - name: label_color
    label: Small labels color (hex)
    type: string
- name: settings_homepage
  label: Homepage Design
  type: file
  path: content/settings/homepage.yml
  fields:
  - name: hero_banner_desktop
    label: HERO / Desktop hero artwork (wide)
    type: image
  - name: hero_banner_mobile
    label: HERO / Mobile hero artwork (narrow)
    type: image
  - name: hero_eyebrow
    label: HERO / Hero small line above headline
    type: string
  - name: hero_headline
    label: HERO / Hero main headline (Enter for a line break)
    type: text
  - name: hero_tagline
    label: HERO / Hero tagline (Enter for a line break)
    type: text
  - name: hero_button_show
    label: HERO / Show View the Portraits button
    type: boolean
    default: true
  - name: hero_button_text
    label: HERO / First button label
    type: string
  - name: hero_button_url
    label: HERO / First button destination
    type: string
  - name: hero_button_2_show
    label: HERO / Show Exhibitions button
    type: boolean
    default: true
  - name: hero_button_2_text
    label: HERO / Second button label
    type: string
  - name: hero_button_2_url
    label: HERO / Second button destination
    type: string
  - name: hero_text_width
    label: HERO / Hero text maximum width (px)
    type: number
  - name: hero_eyebrow_gap
    label: HERO / Space below small heading (px)
    type: number
  - name: hero_title_gap
    label: HERO / Space below main heading (px)
    type: number
  - name: hero_tagline_gap
    label: HERO / Space below tagline (px)
    type: number
  - name: hero_overlay_opacity
    label: HERO / Hero dark overlay opacity (0–95)
    type: number
  - name: spotlight_visual_height
    label: Featured content / IMAGE AREA height (px)
    description: Sets the height of image banners above homepage portrait, press and exhibition features. Recommended 220.
    type: number
    default: 220
  - name: spotlight_portrait_background
    label: Featured content / PORTRAIT painted background
    description: Wide artwork behind the portrait image. The portrait itself is automatically selected.
    type: image
    default: /assets/images/painted-background.jpg
  - name: spotlight_portrait_border
    label: Featured content / PORTRAIT white border (px)
    description: White frame around the featured portrait. Recommended 9.
    type: number
    default: 9
  - name: spotlight_portrait_shadow
    label: Featured content / PORTRAIT subtle shadow
    description: Adds a slight shadow behind the white-framed portrait.
    type: boolean
    default: true
  - name: spotlight_press_browser
    label: Featured content / PRESS browser-style image
    description: Displays the publication image in a simplified browser-window banner instead of a plain image.
    type: boolean
    default: true
  - name: spotlight_exhibition_lead_days
    label: FEATURES / Featured content | Exhibition lead time (days)
    description: An eligible show joins the homepage this many days before its opening date, then leaves after its end date.
    type: number
    default: 60
  - name: spotlight_press_days
    label: FEATURES / Featured content | Press duration (days)
    description: Number of days a new article can appear on the homepage; individual articles may override this.
    type: number
    default: 90
  - name: spotlight_exhibitions_enabled
    label: FEATURES / Featured content | Include upcoming exhibitions
    description: If enabled, the next eligible exhibition has first priority on the homepage.
    type: boolean
    default: true
  - name: spotlight_press_enabled
    label: FEATURES / Featured content | Include recent press
    description: If enabled, the newest eligible article has second priority on the homepage.
    type: boolean
    default: true
  - name: spotlight_project_heading
    label: FEATURES / Featured content | Project fallback headline
    type: string
    description: Appears only when there is not enough timely content to fill two homepage columns.
  - name: spotlight_project_description
    label: FEATURES / Featured content | Project fallback description
    type: text
    description: Introductory text in the permanent Project fallback feature.
  - name: spotlight_project_link_label
    label: FEATURES / Featured content | Project fallback link text
    type: string
  - name: spotlight_press_link_label
    label: FEATURES / Featured content | Press link text
    type: string
    description: Button wording for the automatic homepage press feature.
  - name: spotlight_event_link_label
    label: FEATURES / Featured content | Exhibition link text
    type: string
  - name: spotlight_portrait_link_label
    label: FEATURES / Featured content | Portrait link text
    type: string
  - name: event_band_eyebrow
    label: Homepage | Exhibition band small heading (when no show is scheduled)
    type: string
    description: The colored exhibition strip below the rotating features; shown when there is no upcoming event.
  - name: event_band_heading
    label: Homepage | Exhibition band headline (when no show is scheduled)
    type: string
  - name: event_band_description
    label: Homepage | Exhibition band description (when no show is scheduled)
    type: text
  - name: event_band_button_label
    label: Homepage | Exhibition band button label
    type: string
  - name: gallery_preview_eyebrow
    label: Homepage | Portrait gallery small heading
    type: string
  - name: gallery_preview_heading
    label: Homepage | Portrait gallery headline
    type: string
  - name: gallery_preview_link_label
    label: Homepage | Portrait gallery link label
    type: string
  - name: home_press_heading
    label: Homepage | Lower press section heading
    type: string
    description: Controls the separate In the Press section farther down the homepage, not the rotating press spotlight.
  - name: home_press_link_label
    label: Homepage | Lower press section link text
    type: string
  - name: exhibitions_home_image
    label: Exhibitions homepage image (right side)
    type: image
    description: Flyer or photo. Image is decorative and not clickable.
  - name: paint_background
    label: Exhibitions painted background image
    type: image
    description: Defaults to /assets/images/715931084-background-web.jpg
  - name: hero_height
    label: Hero Height
    type: number
  - name: intro_background
    label: Intro Background
    type: string
  - name: hero_eyebrow_rule_width
    label: Hero small pink divider thickness (px)
    type: number
- name: settings_gallery
  label: Portrait Gallery
  type: file
  path: content/settings/gallery.yml
  fields:
  - name: gallery_background
    label: Gallery Background
    type: string
  - name: gallery_spacing
    label: Gallery spacing (px, horizontal and vertical)
    type: number
    default: 22
  - name: gallery_sort
    label: Gallery Sort
    type: select
    options:
      values:
      - custom
      - newest
      - alphabetical
      - random
  - name: gallery_hover_color
    label: Portrait rollover overlay color (hex)
    type: string
  - name: gallery_hover_opacity
    label: Gallery Hover Opacity (0 to 100)
    type: number
    description: 0 = transparent; 100 = fully solid. Try 88.
  - name: gallery_hover_text
    label: Portrait rollover name color (hex)
    type: string
- name: settings_biography
  label: Biography Pages
  type: file
  path: content/settings/biography.yml
  fields:
  - name: bio_name_font
    label: Person name | Font
    type: select
    options:
      values: *id001
  - name: bio_name_size
    label: Person name | Size (px)
    type: number
  - name: bio_name_weight
    label: Person name | Weight
    type: number
  - name: bio_name_color
    label: Person name | Color (hex)
    type: string
  - name: bio_name_line_height
    label: Person name | Line height (e.g. 1.0)
    type: number
  - name: bio_name_letter_spacing
    label: Person name | Letter spacing (px)
    type: number
  - name: bio_name_bottom_gap
    label: Person name | Space below (px)
    type: number
  - name: bio_dates_font
    label: Life dates | Font
    type: select
    options:
      values: *id001
  - name: bio_dates_size
    label: Life dates | Size (px)
    type: number
  - name: bio_dates_weight
    label: Life dates | Weight
    type: number
  - name: bio_dates_color
    label: Life dates | Color (hex)
    type: string
  - name: bio_dates_bottom_gap
    label: Life dates | Space below (px)
    type: number
  - name: bio_details_font
    label: Materials and size | Font
    type: select
    options:
      values: *id001
  - name: bio_details_size
    label: Materials and size | Size (px)
    type: number
  - name: bio_details_weight
    label: Materials and size | Weight
    type: number
  - name: bio_details_color
    label: Materials and size | Color (hex)
    type: string
  - name: bio_details_separator_gap
    label: Materials and size | Separator spacing (px)
    type: number
  - name: bio_rule_width
    label: Biography divider | Thickness (px)
    type: number
  - name: bio_rule_top_gap
    label: Biography divider | Space above (px)
    type: number
  - name: bio_rule_bottom_gap
    label: Biography divider | Space below (px)
    type: number
  - name: bio_nav_font
    label: Previous / Next navigation | Font
    type: select
    options:
      values: *id001
  - name: bio_nav_size
    label: Previous / Next navigation | Name size (px)
    type: number
  - name: bio_nav_label_size
    label: Previous / Next navigation | Label size (px)
    type: number
  - name: bio_nav_color
    label: Previous / Next navigation | Color (hex)
    type: string
  - name: bio_nav_rule_color
    label: Previous / Next navigation | Rule color (hex)
    type: string
  - name: bio_nav_rule_width
    label: Previous / Next navigation | Rule thickness (px)
    type: number
  - name: bio_nav_padding
    label: Previous / Next navigation | Vertical padding (px)
    type: number
  - name: art_font
    label: Artwork information font
    type: select
    options:
      values: *id001
  - name: art_title_size
    label: Artwork title size (px)
    type: number
  - name: art_details_size
    label: Artwork details size (px)
    type: number
  - name: art_color
    label: Artwork information color (hex)
    type: string
  - name: biography_quote_font
    label: Biography quote callout | Font family
    type: select
    options:
      values: *id001
    description: Applies to blockquotes inside biographies only.
  - name: biography_quote_size
    label: Biography quote | Font size (px)
    type: number
    description: Try 22. Adjusts down automatically on small screens.
  - name: biography_quote_weight
    label: Biography quote | Font weight
    type: select
    options:
      values:
      - value: '400'
        label: Regular
      - value: '500'
        label: Medium
      - value: '600'
        label: Semibold
      - value: '700'
        label: Bold
  - name: biography_quote_style
    label: Biography quote | Text style
    type: select
    options:
      values:
      - value: normal
        label: Normal
      - value: italic
        label: Italic
  - name: biography_quote_color
    label: Biography quote | Text color (hex)
    type: string
  - name: biography_quote_background
    label: Biography quote | Background color (hex)
    type: string
  - name: biography_quote_rule_color
    label: Biography quote | Left rule color (hex)
    type: string
  - name: biography_quote_rule_width
    label: Biography quote | Left rule thickness (px)
    type: number
  - name: biography_quote_padding
    label: Biography quote | Inside padding (px)
    type: number
  - name: biography_quote_spacing
    label: Biography quote | Space above and below (px)
    type: number
  - name: research_font
    label: Research callout font
    type: select
    options:
      values: *id001
  - name: research_heading_size
    label: Further Reading / Special Thanks heading size (px)
    type: number
    description: Controls only the two headings inside the research box on individual biography pages. Try 18.
  - name: research_body_size
    label: Further Reading / Special Thanks copy size (px)
    type: number
    description: Controls the text below those headings. Try 16.
  - name: research_background
    label: Research box SOLID background color (hex)
    type: string
    description: 'A single solid hex color, such as #fff0f6. No gradient.'
  - name: research_color
    label: Research box text color (hex)
    type: string
  - name: callout_rule_type
    label: Callout Rule Type
    type: select
    options:
      values:
      - solid
      - gradient
  - name: callout_rule_color
    label: Callout Rule Color
    type: string
  - name: callout_rule_end
    label: Callout Rule End
    type: string
  - name: callout_rule_width
    label: Callout Rule Width
    type: number
  - name: callout_gap
    label: Callout inner spacing (px)
    type: number
  - name: research_rule_width
    label: Research box left rule thickness (px)
    type: number
  - name: panel_rule_width
    label: Information box top rule thickness (px)
    type: number
- name: settings_rules
  label: Rules & Dividers
  type: file
  path: content/settings/rules.yml
  fields:
  - name: divider_rule_type
    label: Divider Rule Type
    type: select
    options:
      values:
      - solid
      - gradient
  - name: divider_rule_color
    label: Divider Rule Color
    type: string
  - name: divider_rule_end
    label: Divider Rule End
    type: string
  - name: divider_rule_width
    label: Divider Rule Width
    type: number
  - name: interior_rule_width
    label: Interior page header rule thickness (px)
    type: number
- name: settings_footer
  label: Footer & Social Media
  type: file
  path: content/settings/footer.yml
  fields:
  - name: footer_rule_width
    label: Footer top rule thickness (px)
    type: number
    description: Full-width decorative rule above the footer. Default 10 px.
  - name: footer_font
    label: Footer font
    type: select
    options:
      values: *id001
  - name: footer_size
    label: Footer size (px)
    type: number
  - name: footer_color
    label: Footer color (hex)
    type: string
  - name: social_nav_enabled
    label: Show social icons in navigation
    type: boolean
  - name: social_footer_enabled
    label: Show social icons in footer
    type: boolean
  - name: instagram_url
    label: Instagram profile URL
    type: string
  - name: bluesky_url
    label: Bluesky profile URL
    type: string
  - name: tiktok_url
    label: TikTok profile URL (optional)
    type: string
  - name: shop_url
    label: Shop Url
    type: string
    description: Used for the Shop navigation link, not biography purchase buttons.
- name: pages
  label: Site pages
  type: collection
  path: content/pages
  filename: '{primary}.md'
  view:
    fields:
    - title
    primary: title
  fields:
  - name: title
    label: Page title
    type: string
    required: true
  - name: subtitle
    label: Intro subtitle
    type: text
    description: Press Enter for a desktop line break. On mobile the text wraps naturally.
  - name: hero_image
    label: Page header image (1200 × 400 px)
    description: Upload a 1200 × 400 image with the artwork on the right and a fade to #eeeeee on the left. Text overlays the left half on desktop.
    type: image
  - name: hero_mobile_image
    label: Mobile header image (800 × 500 px, optional)
    description: Optional artwork-only mobile crop, shown beneath the title. If blank, the desktop header image is used.
    type: image
  - name: body
    label: Page content
    type: rich-text
    description: Main editorial text. On Exhibitions, existing year-by-year entries live here; add new dated events under Exhibitions and events instead.
  - name: exhibitions_featured_enabled
    label: Exhibitions page | Show featured right column
    type: boolean
    default: true
    description: Only affects the Exhibitions page. Displays featured upcoming shows as tall graphic cards on the right.
  - name: exhibitions_featured_heading
    label: Exhibitions page | Right column heading
    type: string
    default: Featured & Upcoming
  - name: exhibitions_featured_empty
    label: Exhibitions page | Message when no featured shows
    type: string
    default: New exhibitions will be announced here.
    description: Shown in the right column until a future event is marked as featured.
  # The following project sidebar fields are used only by content/pages/the-project.md.
  - name: project_sidebar_enabled
    label: The Project | Show right-hand content column
    type: boolean
    default: true
    description: Only affects The Project page. Turn off to return to the original full-width editorial layout and press section below.
  - name: project_sidebar_image
    label: The Project | Right column header artwork (optional)
    type: image
    description: Optional wide painted image at the top of the right column. Independent of the page header and supporting images.
  - name: project_sidebar_image_alt
    label: The Project | Right column image description
    type: string
  - name: project_sidebar_heading
    label: The Project | Right column heading (optional)
    type: string
  - name: project_sidebar_body
    label: The Project | Right column editable text
    type: rich-text
    description: Ordinary paragraphs, headings, bold, italics and links. Leave blank to show only the press section.
  - name: project_sidebar_callout
    label: The Project | Right column highlight text (optional)
    type: rich-text
    description: Separate highlighted text block above Press & Media. Leave blank to hide.
  - name: project_sidebar_press_enabled
    label: The Project | Show Press & Media in right column
    type: boolean
    default: true
  - name: project_sidebar_press_heading
    label: The Project | Press section heading
    type: string
    default: Press & Media
  - name: project_sidebar_press_intro
    label: The Project | Press introduction (optional)
    type: rich-text
  - name: project_sidebar_press_limit
    label: The Project | Number of press items (0 shows all)
    type: number
    default: 0
    description: Shows newest first. Set to 0 to include every published article.
  - name: project_press_show_images
    label: The Project | Show press logos / thumbnails
    description: Shows one image per article, prioritizing your uploaded logo, then an article thumbnail or automatic image.
    type: boolean
    default: true
  - name: project_press_image_width
    label: The Project | Logo / thumbnail width (pixels)
    type: number
    default: 95
  - name: project_press_title_font
    label: The Project | Article title font
    type: select
    default: DM Sans
    options:
    - label: Clean sans-serif (DM Sans)
      value: DM Sans
    - label: Condensed (Barlow Condensed)
      value: Barlow Condensed
    - label: Serif (Georgia)
      value: Georgia
  - name: project_press_title_size
    label: The Project | Article title size (pixels)
    type: number
    default: 19
  - name: project_press_title_weight
    label: The Project | Article title weight
    description: Semibold is the recommended cleaner default; this changes only article titles, not the Press & Media heading.
    type: select
    default: '600'
    options:
    - label: Regular
      value: '400'
    - label: Medium
      value: '500'
    - label: Semibold
      value: '600'
    - label: Bold
      value: '700'
  - name: project_press_rule_color
    label: The Project | Article divider color (hex)
    description: Thin horizontal line between press items. Enter a color such as #d7d7d7.
    type: string
    default: '#d7d7d7'
  - name: project_press_rule_spacing
    label: The Project | Divider spacing (pixels)
    description: Controls the space above and below each press article divider.
    type: number
    default: 18
  - name: supporting_images
    label: Supporting images alongside page sections
    type: object
    list: true
    description: Add an image and match its section heading exactly (for example, Where it began). Leave caption empty to show no caption.
    fields:
    - name: section_heading
      label: Related section heading (exact wording)
      type: string
      required: true
      description: Match a heading in Page content, without the # marks. For the opening text use the first heading.
    - name: image
      label: Supporting image
      type: image
      required: true
    - name: caption
      label: Small caption (optional)
      type: string
    - name: alt_text
      label: Image description for accessibility
      type: string
    - name: placement
      label: Image placement
      type: select
      default: right
      options:
        values:
        - label: Right column
          value: right
        - label: Left column
          value: left
        - label: Full width below section (explicit only)
          value: full
  - name: callouts
    label: Quotes, callouts & featured statements
    type: object
    list: true
    description: Add blocks in order. For exact inline placement, put [callout-1], [callout-2], etc. in Page content, matching their order here. Otherwise choose a section and placement.
    fields:
    - name: style
      label: Style
      type: select
      default: quote
      options:
        values:
        - label: Pull Quote (10px left rule)
          value: quote
        - label: Highlight / Callout
          value: highlight
        - label: Featured Statement (thin horizontal rules)
          value: statement
    - name: heading
      label: Optional heading
      type: string
    - name: text
      label: Quote or callout text
      type: text
      description: Use **bold**, *italic*, or ***bold italic***. Blank lines create paragraphs.
      required: true
    - name: attribution
      label: Attribution / source (optional)
      type: string
    - name: section_heading
      label: Related section heading (exact wording)
      type: string
      description: Match a heading in Page content. Not needed when using an inline [callout-N] marker.
    - name: position
      label: Position within section
      type: select
      default: after-heading
      options:
        values:
        - label: Before section
          value: before-section
        - label: After heading
          value: after-heading
        - label: After section text
          value: after-section
    - name: layout
      label: Layout
      type: select
      default: text
      options:
        values:
        - label: Text column
          value: text
        - label: Side image area
          value: side
        - label: Full width below section (explicit only)
          value: full
    - name: alignment
      label: Text alignment
      type: select
      default: left
      options:
        values:
        - label: Left
          value: left
        - label: Center
          value: center
        - label: Right
          value: right
- name: settings_callouts
  label: Page Design | Callouts & Quotes
  type: file
  path: content/settings/callouts.yml
  fields:
  - name: callout_accent
    label: Pull quote rule color
    type: string
    default: '#ed398b'
  - name: callout_quote_rule
    label: Pull quote vertical rule (px)
    type: number
    default: 10
  - name: callout_statement_rule
    label: Featured statement horizontal rule (px)
    type: number
    default: 2
  - name: callout_highlight_background
    label: Highlight tint color (hex)
    type: string
    default: '#ed398b'
  - name: callout_highlight_opacity
    label: Highlight tint opacity (percent)
    type: number
    default: 12
  - name: callout_highlight_text_color
    label: Highlight text and heading color
    type: string
    default: '#082d3b'
  - name: callout_highlight_heading_size
    label: Highlight heading size (px)
    type: number
    default: 26
  - name: callout_quote_font_size
    label: Pull quote text size (px)
    type: number
    default: 20
  - name: callout_statement_font_size
    label: Featured statement text size (px)
    type: number
    default: 21
  - name: callout_spacing
    label: Callout vertical spacing (px)
    type: number
    default: 26
- name: events
  label: Exhibitions and events
  type: collection
  path: content/events
  filename: '{primary}.md'
  view:
    fields:
    - title
    - date
    - published
    primary: title
  fields:
  - name: title
    label: Event name
    type: string
    required: true
  - name: date
    label: Event opening / start date
    description: Required for automatic upcoming/past grouping and homepage promotion.
    type: date
    required: true
  - name: end_date
    label: Event end date (optional)
    type: date
    description: If blank, event is treated as a one-day event. Once this date passes it moves to Previous Exhibitions.
  - name: location
    label: Location (short display line)
    type: string
    description: A short location such as Boston, MA; shown in lists and on the homepage.
  - name: venue
    label: Venue / gallery name
    type: string
    description: Displayed in the featured event card. Leave blank if the short location is enough.
  - name: address
    label: Venue address (optional)
    type: string
    description: Street address or full location, displayed below the venue.
  - name: reception
    label: Opening reception (optional)
    type: string
    description: For example Friday, April 9, 6–8 PM. Shown on the featured card.
  - name: hours
    label: Gallery hours (optional)
    type: string
    description: Visiting hours for the featured exhibition.
  - name: featured_order
    label: Featured display order (lower number first)
    type: number
    default: 10
    description: When multiple shows are featured, lower numbers appear first in the right column.
  - name: link
    label: Event link
    type: string
    description: External event or venue details; leave blank to link to the Exhibitions page from the homepage.
  - name: image
    label: Exhibition poster or featured image
    type: image
    description: Used on the Exhibitions featured card and homepage. A tall poster works well.
  - name: homepage_feature
    label: Allow this event to appear automatically on homepage
    type: boolean
    default: true
    description: Automatically shows within the homepage lead time and disappears after the event ends.
  - name: featured
    label: Feature prominently on Exhibitions page
    type: boolean
    default: false
    description: Show a tall image-and-details card in the right column while the event is upcoming or underway. It also stays in the left chronological list.
  - name: published
    label: Published
    type: boolean
    default: true
  - name: body
    label: Event description
    type: rich-text
    description: Full event information displayed in the featured card and historical listing. Do not duplicate an event in the Exhibitions page body.
