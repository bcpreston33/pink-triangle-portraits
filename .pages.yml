media:
  input: assets/uploads
  output: /assets/uploads
content:
- name: people
  label: Portraits & biographies
  type: collection
  path: content/people
  filename: '{primary}.md'
  view:
    fields:
    - name
    - years
    primary: name
  fields:
  - name: name
    label: Person name
    type: string
    required: true
  - name: years
    label: Life dates
    type: string
  - name: homepage_teaser
    label: Homepage teaser (100–200 characters)
    type: text
    description: Short text shown when this person is the latest portrait. Keep to about 100–200 characters.
  - name: homepage_override
    label: Manually feature this person on homepage (optional)
    type: boolean
    default: false
    description: Normally the newest edited/published biography appears automatically. Check this to force a person
      instead; uncheck to return to automatic. If multiple are checked, the most recently edited one wins.
  - name: artworks
    label: Paintings (add one or more below)
    type: object
    list: true
    fields:
    - name: image
      label: Artwork image
      type: image
      required: true
    - name: medium
      label: Materials
      type: string
    - name: dimensions
      label: Size
      type: string
    - name: published
      label: Published
      type: boolean
      default: true
    - name: display_order
      label: Gallery position (lower numbers first)
      type: number
      default: 100
  - name: body
    label: Biography
    type: rich-text
  - name: sources
    label: Further reading & sources
    type: rich-text
  - name: special_thanks
    label: Special thanks & acknowledgments
    type: rich-text
- name: settings_global
  label: Branding & Global
  type: file
  path: content/settings/global.yml
  fields:
  - name: logo
    label: Logo
    type: image
  - name: logo_width
    label: Logo Width
    type: number
  - name: favicon
    label: Favicon (square PNG recommended)
    type: image
  - name: accent_color
    label: Accent Color
    type: string
  - name: text_color
    label: Base text color (fallback)
    type: string
  - name: page_background
    label: Page Background
    type: string
  - name: button_color
    label: Button Color
    type: string
  - name: button_text_color
    label: Button Text Color
    type: string
  - name: content_width
    label: Content Width
    type: number
  - name: section_spacing
    label: Section Spacing
    type: number
- name: settings_header
  label: Header & Navigation
  type: file
  path: content/settings/header.yml
  fields:
  - name: navigation
    label: Navigation menu items
    type: object
    list: true
    fields:
    - name: label
      label: Menu label
      type: string
    - name: url
      label: Link
      type: string
  - name: nav_background
    label: Nav Background
    type: string
  - name: nav_text_color
    label: Nav Text Color
    type: string
  - name: nav_font
    label: Nav Font
    type: select
    options:
      values: &id001
      - Barlow Condensed
      - DM Sans
      - Caveat
      - Anton
      - Archivo Black
      - Oswald
      - Bebas Neue
      - Manrope
      - Montserrat
      - Outfit
      - Work Sans
      - Libre Baskerville
      - Playfair Display
      - Cormorant Garamond
      - Merriweather
      - Inter
      - Source Sans 3
      - Lato
      - Nunito Sans
      - Roboto
      - Poppins
      - Roboto Slab
      - Lora
      - Space Grotesk
      - Barlow
      - Archivo
  - name: nav_font_size
    label: Nav Font Size
    type: number
    description: Size of menu links, not the main page title.
  - name: nav_weight
    label: Navigation weight (400–900)
    type: number
  - name: nav_tracking
    label: Navigation letter spacing (px)
    type: number
  - name: nav_gap
    label: Nav Gap
    type: number
  - name: nav_rule_type
    label: Navigation bottom rule type
    type: select
    options:
      values:
      - solid
      - gradient
  - name: nav_rule_color
    label: Navigation rule start color
    type: string
  - name: nav_rule_end
    label: Navigation rule end color
    type: string
  - name: nav_rule_width
    label: Navigation rule thickness
    type: number
  - name: social_icon_gap
    label: Social icon spacing (px)
    type: number
    description: Space between icons in both header and footer.
  - name: social_icon_mobile_gap
    label: Social icon spacing on small screens (px)
    type: number
- name: settings_typography
  label: Typography
  type: file
  path: content/settings/typography.yml
  fields:
  - name: heading_font
    label: Fallback heading font (used when no specific heading font is set)
    type: select
    options:
      values: *id001
  - name: body_font
    label: Body Font
    type: select
    options:
      values: *id001
  - name: body_size
    label: Body text and biographies size (px)
    type: number
    description: Regular paragraph text throughout the site.
  - name: body_weight
    label: Body text and biographies weight (400–900)
    type: number
  - name: body_leading
    label: Body line height (e.g. 1.75)
    type: number
  - name: paragraph_spacing
    label: Paragraph spacing (px) - regular page content
    type: number
    description: Space after each paragraph on editorial pages.
  - name: section_heading_spacing
    label: Space above section headings (px) - regular page content
    type: number
    description: Space above H2 and H3 headings on editorial pages.
  - name: body_color
    label: Body text color (overrides base text color)
    type: string
  - name: display_font
    label: Page headings font
    type: select
    options:
      values: *id001
  - name: display_size
    label: Page headings size (px)
    type: number
    description: Large page titles such as The Project or a person’s name.
  - name: display_mobile_size
    label: Page heading mobile size (px)
    type: number
  - name: display_weight
    label: Page headings weight (400–900)
    type: number
  - name: display_tracking
    label: Page headings letter spacing (px)
    type: number
  - name: heading_color
    label: Page headings color (hex)
    type: string
  - name: section_font
    label: Section headings font
    type: select
    options:
      values: *id001
  - name: section_size
    label: Section headings size (px)
    type: number
    description: Headings within page content, not research-box headings.
  - name: section_weight
    label: Section headings weight (400–900)
    type: number
  - name: section_color
    label: Section headings color (hex)
    type: string
  - name: label_font
    label: Small labels font
    type: select
    options:
      values: *id001
  - name: label_size
    label: Small labels size (px)
    type: number
  - name: label_weight
    label: Small labels weight (400–900)
    type: number
  - name: label_tracking
    label: Small labels letter spacing (px)
    type: number
  - name: label_color
    label: Small labels color (hex)
    type: string
- name: settings_homepage
  label: Homepage Design
  type: file
  path: content/settings/homepage.yml
  fields:
  - name: hero_banner_desktop
    label: Desktop hero artwork (wide)
    type: image
  - name: hero_banner_mobile
    label: Mobile hero artwork (narrow)
    type: image
  - name: hero_eyebrow
    label: Hero small line above headline
    type: string
  - name: hero_headline
    label: Hero main headline (use a line break for two lines)
    type: text
  - name: hero_tagline
    label: Hero tagline
    type: string
  - name: hero_button_text
    label: Hero button text
    type: string
  - name: hero_overlay_opacity
    label: Hero dark overlay opacity (0–95)
    type: number
  - name: exhibitions_home_image
    label: Exhibitions homepage image (right side)
    type: image
    description: Flyer or photo. Image is decorative and not clickable.
  - name: paint_background
    label: Exhibitions painted background image
    type: image
    description: Defaults to /assets/images/715931084-background-web.jpg
  - name: hero_height
    label: Hero Height
    type: number
  - name: intro_background
    label: Intro Background
    type: string
  - name: hero_eyebrow_rule_width
    label: Hero small pink divider thickness (px)
    type: number
- name: settings_gallery
  label: Portrait Gallery
  type: file
  path: content/settings/gallery.yml
  fields:
  - name: gallery_background
    label: Gallery Background
    type: string
  - name: gallery_sort
    label: Gallery Sort
    type: select
    options:
      values:
      - custom
      - newest
      - alphabetical
      - random
  - name: gallery_hover_color
    label: Portrait rollover overlay color (hex)
    type: string
  - name: gallery_hover_opacity
    label: Gallery Hover Opacity (0 to 100)
    type: number
    description: 0 = transparent; 100 = fully solid. Try 88.
  - name: gallery_hover_text
    label: Portrait rollover name color (hex)
    type: string
- name: settings_biography
  label: Biography Pages
  type: file
  path: content/settings/biography.yml
  fields:
  - name: art_font
    label: Artwork information font
    type: select
    options:
      values: *id001
  - name: art_title_size
    label: Artwork title size (px)
    type: number
  - name: art_details_size
    label: Artwork details size (px)
    type: number
  - name: art_color
    label: Artwork information color (hex)
    type: string
  - name: biography_quote_font
    label: Biography quote callout | Font family
    type: select
    options:
      values: *id001
    description: Applies to blockquotes inside biographies only.
  - name: biography_quote_size
    label: Biography quote | Font size (px)
    type: number
    description: Try 22. Adjusts down automatically on small screens.
  - name: biography_quote_weight
    label: Biography quote | Font weight
    type: select
    options:
      values:
      - value: '400'
        label: Regular
      - value: '500'
        label: Medium
      - value: '600'
        label: Semibold
      - value: '700'
        label: Bold
  - name: biography_quote_style
    label: Biography quote | Text style
    type: select
    options:
      values:
      - value: normal
        label: Normal
      - value: italic
        label: Italic
  - name: biography_quote_color
    label: Biography quote | Text color (hex)
    type: string
  - name: biography_quote_background
    label: Biography quote | Background color (hex)
    type: string
  - name: biography_quote_rule_color
    label: Biography quote | Left rule color (hex)
    type: string
  - name: biography_quote_rule_width
    label: Biography quote | Left rule thickness (px)
    type: number
  - name: biography_quote_padding
    label: Biography quote | Inside padding (px)
    type: number
  - name: biography_quote_spacing
    label: Biography quote | Space above and below (px)
    type: number
  - name: research_font
    label: Research callout font
    type: select
    options:
      values: *id001
  - name: research_heading_size
    label: Further Reading / Special Thanks heading size (px)
    type: number
    description: Controls only the two headings inside the research box on individual biography pages. Try 18.
  - name: research_body_size
    label: Further Reading / Special Thanks copy size (px)
    type: number
    description: Controls the text below those headings. Try 16.
  - name: research_background
    label: Research box SOLID background color (hex)
    type: string
    description: 'A single solid hex color, such as #fff0f6. No gradient.'
  - name: research_color
    label: Research box text color (hex)
    type: string
  - name: callout_rule_type
    label: Callout Rule Type
    type: select
    options:
      values:
      - solid
      - gradient
  - name: callout_rule_color
    label: Callout Rule Color
    type: string
  - name: callout_rule_end
    label: Callout Rule End
    type: string
  - name: callout_rule_width
    label: Callout Rule Width
    type: number
  - name: callout_gap
    label: Callout inner spacing (px)
    type: number
  - name: research_rule_width
    label: Research box left rule thickness (px)
    type: number
  - name: panel_rule_width
    label: Information box top rule thickness (px)
    type: number
- name: settings_rules
  label: Rules & Dividers
  type: file
  path: content/settings/rules.yml
  fields:
  - name: divider_rule_type
    label: Divider Rule Type
    type: select
    options:
      values:
      - solid
      - gradient
  - name: divider_rule_color
    label: Divider Rule Color
    type: string
  - name: divider_rule_end
    label: Divider Rule End
    type: string
  - name: divider_rule_width
    label: Divider Rule Width
    type: number
  - name: interior_rule_width
    label: Interior page header rule thickness (px)
    type: number
- name: settings_footer
  label: Footer & Social Media
  type: file
  path: content/settings/footer.yml
  fields:
  - name: footer_font
    label: Footer font
    type: select
    options:
      values: *id001
  - name: footer_size
    label: Footer size (px)
    type: number
  - name: footer_color
    label: Footer color (hex)
    type: string
  - name: social_nav_enabled
    label: Show social icons in navigation
    type: boolean
  - name: social_footer_enabled
    label: Show social icons in footer
    type: boolean
  - name: instagram_url
    label: Instagram profile URL
    type: string
  - name: bluesky_url
    label: Bluesky profile URL
    type: string
  - name: tiktok_url
    label: TikTok profile URL (optional)
    type: string
  - name: shop_url
    label: Shop Url
    type: string
    description: Used for the Shop navigation link, not biography purchase buttons.
- name: pages
  label: Site pages
  type: collection
  path: content/pages
  filename: '{primary}.md'
  view:
    fields:
    - title
    primary: title
  fields:
  - name: title
    label: Page title
    type: string
    required: true
  - name: subtitle
    label: Intro subtitle
    type: string
  - name: hero_image
    label: Header image (optional)
    type: image
  - name: body
    label: Page content
    type: rich-text
  - name: supporting_images
    label: Supporting images alongside page sections
    type: object
    list: true
    description: Add an image and match its section heading exactly (for example, Where it began). Leave caption empty to show no caption.
    fields:
    - name: section_heading
      label: Related section heading (exact wording)
      type: string
      required: true
      description: Match a heading in Page content, without the # marks. For the opening text use the first heading.
    - name: image
      label: Supporting image
      type: image
      required: true
    - name: caption
      label: Small caption (optional)
      type: string
    - name: alt_text
      label: Image description for accessibility
      type: string
    - name: placement
      label: Image placement
      type: select
      default: right
      options:
      - label: Right column
        value: right
      - label: Left column
        value: left
      - label: Full width below section
        value: full
- name: events
  label: Exhibitions and events
  type: collection
  path: content/events
  filename: '{primary}.md'
  view:
    fields:
    - title
    - date
    - published
    primary: title
  fields:
  - name: title
    label: Event name
    type: string
    required: true
  - name: date
    label: Event date
    type: date
    required: true
  - name: end_date
    label: Event end date (optional)
    type: date
    description: If blank, event is treated as a one-day event. Once this date passes it moves to Previous Exhibitions.
  - name: location
    label: Location
    type: string
  - name: link
    label: Event link
    type: string
  - name: image
    label: Event image
    type: image
  - name: published
    label: Published
    type: boolean
    default: true
  - name: body
    label: Event description
    type: rich-text
