media:
  input: assets/uploads
  output: /assets/uploads
content:
- name: press
  label: Press & Media
  type: collection
  path: content/press
  filename: '{primary}.md'
  view:
    fields:
    - title
    - publication
    - date
    primary: title
  fields:
  - name: title
    label: Article headline
    description: Appears on The Project page and in the automatic homepage press feature.
    type: string
    required: true
  - name: publication
    label: Publication or outlet
    description: The publisher name shown above the article headline.
    type: string
  - name: date
    label: Publication date
    description: Used to sort articles and determine when they rotate off the homepage.
    type: date
  - name: summary
    label: Short description
    description: Appears below the headline and in the homepage feature. Keep it brief.
    type: text
  - name: logo
    label: 01 · BRAND IDENTITY | Logo
    type: image
    description: Preferred over thumbnails and automatic logos. Leave empty to use automatic detection.
  - name: image
    label: Article thumbnail (optional override)
    type: image
    description: Used in the Project page and lower press list if no custom logo is supplied. For a homepage screenshot,
      use the separate Homepage spotlight field below.
  - name: homepage_image
    label: Homepage spotlight | Article screenshot (optional)
    type: image
    description: Only the rotating homepage press feature uses this image, inside the browser-style banner. Upload a
      screenshot of the article here. The Project page and lower press list continue using the publication logo or article
      thumbnail. Leave empty to use those existing images automatically.
  - name: url
    label: Link to article / recording
    description: The external page opened when visitors select this feature.
    type: string
  - name: link_label
    label: Link text (optional)
    type: string
  - name: hide_image
    label: Hide image for this article
    type: boolean
    default: false
    description: Hides the logo/thumbnail for this article even when images are enabled on The Project page.
  - name: homepage_feature
    label: Allow this article to appear automatically on homepage
    type: boolean
    default: true
  - name: homepage_priority
    label: Keep this article as the homepage press feature
    type: boolean
    default: false
    description: Pins this article ahead of newer press and keeps it featured past the normal expiration. Only use for
      one article at a time.
  - name: homepage_days
    label: Homepage feature duration (days, optional override)
    type: number
    description: Leave blank to use the homepage default (90 days).
  - name: homepage_until
    label: Keep featured until this date (optional)
    type: date
    description: Overrides the automatic expiration date for this article.
  - name: published
    label: Publish this press item
    description: Turn off to hide this item from all public press sections.
    type: boolean
    default: true
- name: people
  label: Portraits & biographies
  type: collection
  path: content/people
  filename: '{primary}.md'
  view:
    fields:
    - name
    - years
    primary: name
  fields:
  - name: name
    label: Person name
    type: string
    required: true
  - name: years
    label: Life dates
    type: string
  - name: homepage_teaser
    label: Homepage teaser (100–200 characters)
    type: text
    description: Short text shown when this person is the latest portrait. Keep to about 100–200 characters.
  - name: homepage_override
    label: Manually feature this person on homepage (optional)
    type: boolean
    default: false
    description: Normally the newest edited/published biography appears automatically. Check this to force a person instead;
      uncheck to return to automatic. If multiple are checked, the most recently edited one wins.
  - name: artworks
    label: Paintings (add one or more below)
    type: object
    list: true
    fields:
    - name: image
      label: Artwork image
      type: image
      required: true
    - name: medium
      label: Materials
      type: string
    - name: dimensions
      label: Size
      type: string
    - name: published
      label: Published
      type: boolean
      default: true
    - name: display_order
      label: Gallery position (lower numbers first)
      type: number
      default: 100
    - name: gallery_thumbnail
      label: Gallery thumbnail (optional square image)
      type: image
      description: Used only in the Portraits gallery. Leave empty to use the artwork image.
  - name: body
    label: Biography
    type: rich-text
  - name: sources
    label: Further reading & sources
    type: rich-text
  - name: special_thanks
    label: Special thanks & acknowledgments
    type: rich-text
- name: settings_global
  label: Branding & Global
  type: file
  path: content/settings/global.yml
  fields:
  - name: logo
    label: Logo
    type: image
  - name: logo_width
    label: 01 · BRAND IDENTITY | Logo Width
    type: number
  - name: favicon
    label: 01 · BRAND IDENTITY | Favicon (square PNG recommended)
    type: image
  - name: accent_color
    label: 02 · PROJECT COLORS | Accent Color
    type: string
  - name: text_color
    label: 02 · PROJECT COLORS | Base text color (fallback)
    type: string
  - name: page_background
    label: 02 · PROJECT COLORS | Page Background
    type: string
  - name: button_color
    label: 02 · PROJECT COLORS | Button Color
    type: string
  - name: button_text_color
    label: 02 · PROJECT COLORS | Button Text Color
    type: string
  - name: content_width
    label: 03 · PAGE WIDTH & SPACING | Content Width
    type: number
  - name: section_spacing
    label: 03 · PAGE WIDTH & SPACING | Section Spacing
    type: number
- name: settings_header
  label: Header & Navigation
  type: file
  path: content/settings/header.yml
  fields:
  - name: navigation
    label: 01 · NAVIGATION LINKS | Navigation menu items
    type: object
    list: true
    fields:
    - name: label
      label: Menu label
      type: string
    - name: url
      label: Link
      type: string
  - name: interior_header_height
    label: 02 · HEADER SIZE & COLORS | Desktop page header height (px)
    type: number
    default: 350
    description: Height of interior page headers with artwork. Try 300, 350, or 400. Mobile adjusts automatically.
  - name: nav_background
    label: 02 · HEADER SIZE & COLORS | Nav Background
    type: string
  - name: nav_text_color
    label: 02 · HEADER SIZE & COLORS | Nav Text Color
    type: string
  - name: nav_font
    label: 03 · NAVIGATION TYPOGRAPHY | Nav Font
    type: select
    options:
      values: &id001
      - Barlow Condensed
      - DM Sans
      - Caveat
      - Anton
      - Archivo Black
      - Oswald
      - Bebas Neue
      - Manrope
      - Montserrat
      - Outfit
      - Work Sans
      - Libre Baskerville
      - Playfair Display
      - Cormorant Garamond
      - Merriweather
      - Inter
      - Source Sans 3
      - Lato
      - Nunito Sans
      - Roboto
      - Poppins
      - Roboto Slab
      - Lora
      - Space Grotesk
      - Barlow
      - Archivo
  - name: nav_font_size
    label: 03 · NAVIGATION TYPOGRAPHY | Nav Font Size
    type: number
    description: Size of menu links, not the main page title.
  - name: nav_weight
    label: 03 · NAVIGATION TYPOGRAPHY | Navigation weight (400–900)
    type: number
  - name: nav_tracking
    label: 03 · NAVIGATION TYPOGRAPHY | Navigation letter spacing (px)
    type: number
  - name: nav_gap
    label: 04 · NAVIGATION SPACING & RULE | Nav Gap
    type: number
  - name: nav_rule_type
    label: 04 · NAVIGATION SPACING & RULE | Navigation bottom rule type
    type: select
    options:
      values:
      - solid
      - gradient
  - name: nav_rule_color
    label: 04 · NAVIGATION SPACING & RULE | Navigation rule start color
    type: string
  - name: nav_rule_end
    label: 04 · NAVIGATION SPACING & RULE | Navigation rule end color
    type: string
  - name: nav_rule_width
    label: 04 · NAVIGATION SPACING & RULE | Navigation rule thickness
    type: number
  - name: social_icon_gap
    label: 05 · SOCIAL ICON SPACING | Social icon spacing (px)
    type: number
    description: Space between icons in both header and footer.
  - name: social_icon_mobile_gap
    label: 05 · SOCIAL ICON SPACING | Social icon spacing on small screens (px)
    type: number
- name: settings_typography
  label: Typography
  type: file
  path: content/settings/typography.yml
  fields:
  - name: heading_font
    label: Fallback heading font (used when no specific heading font is set)
    type: select
    options:
      values: *id001
  - name: body_font
    label: Body Font
    type: select
    options:
      values: *id001
  - name: body_size
    label: Body text and biographies size (px)
    type: number
    description: Regular paragraph text throughout the site.
  - name: body_weight
    label: Body text and biographies weight (400–900)
    type: number
  - name: body_leading
    label: Body line height (e.g. 1.75)
    type: number
  - name: paragraph_spacing
    label: Paragraph spacing (px) - regular page content
    type: number
    description: Space after each paragraph on editorial pages.
  - name: section_heading_spacing
    label: Space above section headings (px) - regular page content
    type: number
    description: Space above H2 and H3 headings on editorial pages.
  - name: body_color
    label: Body text color (overrides base text color)
    type: string
  - name: page_title_line_height
    label: 01 · PAGE HEADER | Page title line height (e.g. 1.05)
    type: number
    default: 1.05
    description: Spacing between lines when an interior page title wraps.
  - name: page_tagline_line_height
    label: Page tagline line height (e.g. 1.15)
    type: number
    default: 1.15
    description: Spacing between lines of the handwritten tagline in interior page headers.
  - name: display_font
    label: Page headings font
    type: select
    options:
      values: *id001
  - name: display_size
    label: Page headings size (px)
    type: number
    description: Large page titles such as The Project or a person’s name.
  - name: display_mobile_size
    label: Page heading mobile size (px)
    type: number
  - name: responsive_title_min
    label: 02 · RESPONSIVE PAGE BANNERS | Minimum desktop/tablet title size (px)
    type: number
    default: 80
    description: Keeps interior page titles readable while the banner image crops independently. Applies above 700px.
  - name: responsive_title_max
    label: 02 · RESPONSIVE PAGE BANNERS | Maximum desktop title size (px)
    type: number
    default: 112
    description: Upper limit for interior page title size on wide monitors.
  - name: responsive_mobile_title
    label: 02 · RESPONSIVE PAGE BANNERS | Mobile title size (px)
    type: number
    default: 68
    description: Maximum title size on phones. The title automatically fits smaller phone widths.
  - name: responsive_mobile_paint_height
    label: 02 · RESPONSIVE PAGE BANNERS | Mobile painted border height (px)
    type: number
    default: 85
    description: Height of the shallow painted strip beneath the text. Mobile page banner photos are intentionally hidden;
      desktop banners remain unchanged.
  - name: display_weight
    label: Page headings weight (400–900)
    type: number
  - name: display_tracking
    label: Page headings letter spacing (px)
    type: number
  - name: heading_color
    label: Page headings color (hex)
    type: string
  - name: section_font
    label: Section headings font
    type: select
    options:
      values: *id001
  - name: section_size
    label: Section headings size (px)
    type: number
    description: Headings within page content, not research-box headings.
  - name: section_weight
    label: Section headings weight (400–900)
    type: number
  - name: section_color
    label: Section headings color (hex)
    type: string
  - name: label_font
    label: Small labels font
    type: select
    options:
      values: *id001
  - name: label_size
    label: Small labels size (px)
    type: number
  - name: label_weight
    label: Small labels weight (400–900)
    type: number
  - name: label_tracking
    label: Small labels letter spacing (px)
    type: number
  - name: label_color
    label: Small labels color (hex)
    type: string
- name: settings_homepage
  label: Homepage Design · 7 labeled sections
  type: file
  path: content/settings/homepage.yml
  fields:
  - name: hero_banner_desktop
    label: 01 · HERO / MAIN HEADER  |  Desktop hero background image
    type: image
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_banner_mobile
    label: 01 · HERO / MAIN HEADER  |  Mobile hero background image
    type: image
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_eyebrow
    label: 01 · HERO / MAIN HEADER  |  Small heading above hero title
    type: string
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_headline
    label: 01 · HERO / MAIN HEADER  |  Main hero title
    type: text
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_tagline
    label: 01 · HERO / MAIN HEADER  |  Hero tagline
    type: text
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_button_show
    label: 01 · HERO / MAIN HEADER  |  Show first hero button
    type: boolean
    default: true
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_button_text
    label: 01 · HERO / MAIN HEADER  |  First button text
    type: string
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_button_url
    label: 01 · HERO / MAIN HEADER  |  First button link
    type: string
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_button_2_show
    label: 01 · HERO / MAIN HEADER  |  Show second hero button
    type: boolean
    default: true
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_button_2_text
    label: 01 · HERO / MAIN HEADER  |  Second button text
    type: string
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_button_2_url
    label: 01 · HERO / MAIN HEADER  |  Second button link
    type: string
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_height
    label: 01 · HERO / MAIN HEADER  |  Hero height (px)
    type: number
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_text_width
    label: 01 · HERO / MAIN HEADER  |  Hero text maximum width (px)
    type: number
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_eyebrow_gap
    label: 01 · HERO / MAIN HEADER  |  Space after small heading (px)
    type: number
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_title_gap
    label: 01 · HERO / MAIN HEADER  |  Space after main title (px)
    type: number
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_tagline_gap
    label: 01 · HERO / MAIN HEADER  |  Space after tagline (px)
    type: number
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_overlay_opacity
    label: 01 · HERO / MAIN HEADER  |  Dark overlay opacity (0–95)
    type: number
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: hero_eyebrow_rule_width
    label: 01 · HERO / MAIN HEADER  |  Small pink rule thickness (px)
    type: number
    description: 'Top of homepage: main artwork, headline, tagline, buttons, and their layout.'
  - name: spotlight_exhibitions_enabled
    label: 02 · FEATURED CONTENT / ROTATION  |  Include upcoming exhibitions automatically
    description: If enabled, the next eligible exhibition has first priority on the homepage.
    type: boolean
    default: true
  - name: spotlight_exhibition_lead_days
    label: 02 · FEATURED CONTENT / ROTATION  |  Show exhibitions this many days ahead
    description: Upcoming events come from Exhibitions and events; this controls how early they become eligible for the
      homepage.
    type: number
    default: 60
  - name: spotlight_press_enabled
    label: 02 · FEATURED CONTENT / ROTATION  |  Include recent press automatically
    description: If enabled, the newest eligible article has second priority on the homepage.
    type: boolean
    default: true
  - name: spotlight_press_days
    label: 02 · FEATURED CONTENT / ROTATION  |  Default press feature duration (days)
    description: Press entries and dates come from Press & Media. Individual article overrides can extend their display.
    type: number
    default: 90
  - name: spotlight_project_heading
    label: 02 · FEATURED CONTENT / ROTATION  |  Fallback Project headline
    type: string
    description: Shown only when the Project fallback is selected by the automatic feature rotation.
  - name: spotlight_project_description
    label: 02 · FEATURED CONTENT / ROTATION  |  Fallback Project description
    type: text
    description: Shown only when the Project fallback is selected.
  - name: spotlight_project_link_label
    label: 02 · FEATURED CONTENT / ROTATION  |  Fallback Project link text
    type: string
    description: 'Below the hero: automatically chosen exhibition, press article, latest portrait, and fallback project.'
  - name: spotlight_press_link_label
    label: 02 · FEATURED CONTENT / ROTATION  |  Press feature link text
    type: string
    description: Button wording for the automatic homepage press feature.
  - name: spotlight_event_link_label
    label: 02 · FEATURED CONTENT / ROTATION  |  Exhibition feature link text
    type: string
    description: 'Below the hero: automatically chosen exhibition, press article, latest portrait, and fallback project.'
  - name: spotlight_portrait_link_label
    label: 02 · FEATURED CONTENT / ROTATION  |  Latest portrait link text
    type: string
    description: 'Below the hero: automatically chosen exhibition, press article, latest portrait, and fallback project.'
  - name: spotlight_visual_height
    label: 03 · FEATURED CONTENT / IMAGES  |  Feature image/banner height (px)
    description: Sets the height of image banners above homepage portrait, press and exhibition features. Recommended
      220.
    type: number
    default: 220
  - name: spotlight_portrait_background
    label: 03 · FEATURED CONTENT / IMAGES  |  Portrait painted banner background
    description: Background behind the newest portrait; the portrait itself is chosen automatically.
    type: image
    default: /assets/images/painted-background.jpg
  - name: spotlight_portrait_border
    label: 03 · FEATURED CONTENT / IMAGES  |  Portrait white frame width (px)
    description: White frame around the featured portrait. Recommended 9.
    type: number
    default: 9
  - name: spotlight_portrait_shadow
    label: 03 · FEATURED CONTENT / IMAGES  |  Show portrait shadow
    description: Adds a slight shadow behind the white-framed portrait.
    type: boolean
    default: true
  - name: spotlight_press_browser
    label: 03 · FEATURED CONTENT / IMAGES  |  Use press laptop/browser presentation
    description: Changes the featured press visual only; article images are edited in Press & Media.
    type: boolean
    default: true
  - name: spotlight_press_background
    label: 03 · FEATURED CONTENT / IMAGES  |  Press painted banner background
    description: Background behind the laptop mockup in the featured press column.
    type: image
  - name: spotlight_press_laptop_size
    label: 03 · FEATURED CONTENT / IMAGES  |  Press laptop scale (%)
    description: Scales the large laptop over the painted banner; the live article screenshot is edited in Press & Media.
    type: number
    default: 145
  - name: spotlight_press_laptop_vertical
    label: 03 · FEATURED CONTENT / IMAGES  |  Press laptop vertical offset (px)
    description: Moves the laptop up or down inside its cropped image banner.
    type: number
    default: 0
  - name: event_band_eyebrow
    label: 04 · EXHIBITIONS & TALKS / WIDE BANNER  |  Small pink heading
    type: string
    description: Large painted banner on the homepage, below the rotating Press and Latest Portrait cards. This text
      is the fallback when there is no upcoming event; an upcoming event can replace the heading and description automatically.
  - name: event_band_heading
    label: 04 · EXHIBITIONS & TALKS / WIDE BANNER  |  Large headline
    type: string
    description: Large heading on the full-width homepage Exhibitions & Talks banner. An upcoming event may automatically
      replace this text.
  - name: event_band_description
    label: 04 · EXHIBITIONS & TALKS / WIDE BANNER  |  Supporting paragraph
    type: text
    description: Paragraph on the full-width homepage Exhibitions & Talks banner. An upcoming event may automatically
      replace this text.
  - name: event_band_button_label
    label: 04 · EXHIBITIONS & TALKS / WIDE BANNER  |  Button text
    type: string
    description: Pink button in the homepage painted Exhibitions banner; it links to the Exhibitions page.
  - name: paint_background
    label: 04 · EXHIBITIONS & TALKS / WIDE BANNER  |  Painted banner background image
    type: image
    description: Background of the full-width homepage Exhibitions & Talks banner (not the featured exhibition card).
  - name: exhibitions_home_image
    label: 04 · EXHIBITIONS & TALKS / WIDE BANNER  |  Additional exhibitions homepage image
    type: image
    description: Separate exhibitions image used by other homepage presentation logic; do not confuse with the wide banner
      background.
  - name: gallery_preview_eyebrow
    label: 05 · EXPLORE PORTRAITS / GALLERY  |  Small pink heading
    type: string
    description: Homepage portrait gallery section below the Exhibitions & Talks banner.
  - name: gallery_preview_heading
    label: 05 · EXPLORE PORTRAITS / GALLERY  |  Large headline
    type: string
    description: Homepage portrait gallery section below the Exhibitions & Talks banner.
  - name: gallery_preview_link_label
    label: 05 · EXPLORE PORTRAITS / GALLERY  |  Gallery link text
    type: string
    description: Homepage portrait gallery section below the Exhibitions & Talks banner.
  - name: gallery_preview_count
    label: 05 · EXPLORE PORTRAITS / GALLERY  |  Number of portraits (1–12)
    type: number
    default: 5
    description: 'Automatic: show this many distinct people. Defaults to 5. The site uses the date each biography was
      FIRST added to GitHub, not the person’s historical dates. Rebuilding the site updates the list.'
  - name: gallery_preview_manual_people
    label: 05 · EXPLORE PORTRAITS / GALLERY  |  Optional featured people (slugs)
    type: text
    description: 'Optional manual override: enter person slugs separated by commas or new lines, in desired order (example:
      gad-beck). These people appear first; remaining slots fill automatically with newest biographies. Leave blank for
      fully automatic.'
  - name: gallery_preview_background
    label: '05 · EXPLORE PORTRAITS / GALLERY  |  Section background color (hex)'
    type: string
    default: '#FCEEF4'
    description: 'Full-width pale pink behind the homepage portraits. Default #FCEEF4. Use #fffdfb for white. Does not affect the main Portrait Gallery page.'
  - name: home_press_heading
    label: 06 · PRESS / LOWER HOMEPAGE  |  Lower press section heading
    type: string
    description: Controls the separate In the Press section farther down the homepage, not the rotating press spotlight.
  - name: home_press_link_label
    label: 06 · PRESS / LOWER HOMEPAGE  |  Lower press link text
    type: string
    description: Additional Press & Media section farther down the homepage; not the rotating feature above.
  - name: intro_background
    label: 07 · GENERAL / BACKGROUNDS  |  Intro background color
    type: string
    description: 'Background color for the introductory homepage area; use a CSS color such as #fffdfb.'
- name: settings_gallery
  label: Portrait Gallery
  type: file
  path: content/settings/gallery.yml
  fields:
  - name: gallery_background
    label: 01 · GALLERY LAYOUT | Gallery Background
    type: string
  - name: gallery_spacing
    label: 01 · GALLERY LAYOUT | Gallery spacing (px, horizontal and vertical)
    type: number
    default: 22
  - name: gallery_sort
    label: 01 · GALLERY LAYOUT | Gallery Sort
    type: select
    options:
      values:
      - custom
      - newest
      - alphabetical
      - random
  - name: gallery_hover_color
    label: 02 · PORTRAIT HOVER | Portrait rollover overlay color (hex)
    type: string
  - name: gallery_hover_opacity
    label: 02 · PORTRAIT HOVER | Gallery Hover Opacity (0 to 100)
    type: number
    description: 0 = transparent; 100 = fully solid. Try 88.
  - name: gallery_hover_text
    label: 02 · PORTRAIT HOVER | Portrait rollover name color (hex)
    type: string
- name: settings_biography
  label: Biography Pages
  type: file
  path: content/settings/biography.yml
  fields:
  - name: bio_name_font
    label: Person name | Font
    type: select
    options:
      values: *id001
  - name: bio_name_size
    label: Person name | Size (px)
    type: number
  - name: bio_name_weight
    label: Person name | Weight
    type: number
  - name: bio_name_color
    label: Person name | Color (hex)
    type: string
  - name: bio_name_line_height
    label: Person name | Line height (e.g. 1.0)
    type: number
  - name: bio_name_letter_spacing
    label: Person name | Letter spacing (px)
    type: number
  - name: bio_name_bottom_gap
    label: Person name | Space below (px)
    type: number
  - name: bio_dates_font
    label: Life dates | Font
    type: select
    options:
      values: *id001
  - name: bio_dates_size
    label: Life dates | Size (px)
    type: number
  - name: bio_dates_weight
    label: Life dates | Weight
    type: number
  - name: bio_dates_color
    label: Life dates | Color (hex)
    type: string
  - name: bio_dates_bottom_gap
    label: Life dates | Space below (px)
