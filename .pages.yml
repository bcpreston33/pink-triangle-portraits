    label: 03 · RESEARCH SIDEBAR | Show research card
    type: boolean
  - name: contact_research_heading
    label: 03 · RESEARCH SIDEBAR | Heading
    type: string
  - name: contact_research_text
    label: 03 · RESEARCH SIDEBAR | Description
    type: text
    description: Text in the light pink sidebar card. The Ask About Research link automatically scrolls to the contact
      form.
  - name: contact_social_visible
    label: 04 · FOLLOW SIDEBAR | Show Follow the Project card
    type: boolean
  - name: contact_social_heading
