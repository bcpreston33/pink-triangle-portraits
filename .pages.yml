    type: string
  - name: contact_social_text
    label: 04 · FOLLOW SIDEBAR | Description
    type: text
    description: The Instagram, Bluesky, and TikTok links are automatically read from Footer & Social Media settings.
  - name: contact_card_order
    label: 05 · SIDEBAR LAYOUT | Card order
    type: select
    description: Choose which sidebar card appears first.
    options:
      values:
      - label: Research first
        value: research_first
      - label: Follow the Project first
        value: social_first
  - name: contact_sidebar_width
    label: 05 · SIDEBAR LAYOUT | Sidebar width (%)
    type: number
    description: 'Percentage of the main content width allocated to the right sidebar. Current value: 35.'
