media:
  input: assets/uploads
  output: /assets/uploads
content:
- name: people
  label: Portraits & biographies
  type: collection
  path: content/people
  filename: '{primary}.md'
  view:
    fields:
    - name
    - years
    primary: name
  fields:
  - name: name
    label: Person name
    type: string
    required: true
  - name: years
    label: Life dates
    type: string
  - name: summary
    label: Introduction
    type: text
  - name: artworks
    label: Paintings (add one or more below)
    type: object
    list: true
    fields:
    - name: title
      label: Artwork title
      type: string
      required: true
    - name: image
      label: Artwork image
      type: image
      required: true
    - name: year
      label: Artwork year
      type: string
    - name: medium
      label: Medium
      type: string
    - name: dimensions
      label: Dimensions
      type: string
    - name: date
      label: Published date
      type: date
      required: true
    - name: published
      label: Published
      type: boolean
      default: true
    - name: featured
      label: Feature on homepage
      type: boolean
      default: false
    - name: display_order
      label: Gallery position (lower numbers first)
      type: number
      default: 100
    - name: summary
      label: Short introduction
      type: text
  - name: body
    label: Biography
    type: rich-text
  - name: sources
    label: Further reading & sources
    type: rich-text
  - name: special_thanks
    label: Special thanks & acknowledgments
    type: rich-text
- name: design
  label: Site appearance, typography & navigation
  type: file
  path: content/settings/site.yml
  fields:
  - name: logo
    label: Logo
    type: image
  - name: logo_width
    label: Logo Width
    type: number
  - name: navigation
    label: Navigation menu items
    type: object
    list: true
    fields:
    - name: label
      label: Menu label
      type: string
    - name: url
      label: Link
      type: string
  - name: nav_background
    label: Nav Background
    type: string
  - name: nav_text_color
    label: Nav Text Color
    type: string
  - name: nav_font
    label: Nav Font
    type: select
    options:
      values: &id001
      - Barlow Condensed
      - DM Sans
      - Caveat
      - Anton
      - Archivo Black
      - Oswald
      - Bebas Neue
      - Manrope
      - Montserrat
      - Outfit
      - Work Sans
      - Libre Baskerville
      - Playfair Display
      - Cormorant Garamond
      - Merriweather
      - Inter
      - Source Sans 3
      - Lato
      - Nunito Sans
      - Roboto
      - Poppins
      - Roboto Slab
      - Lora
      - Space Grotesk
      - Barlow
      - Archivo
  - name: nav_font_size
    label: Nav Font Size
    type: number
  - name: nav_gap
    label: Nav Gap
    type: number
  - name: heading_font
    label: Heading Font
    type: select
    options:
      values: *id001
  - name: display_font
    label: Page headings font
    type: select
    options:
      values: *id001
  - name: display_size
    label: Page headings size (px)
    type: number
  - name: display_mobile_size
    label: Page heading mobile size (px)
    type: number
  - name: display_weight
    label: Page headings weight (400–900)
    type: number
  - name: display_tracking
    label: Page headings letter spacing (px)
    type: number
  - name: heading_color
    label: Page headings color (hex)
    type: string
  - name: section_font
    label: Section headings font
    type: select
    options:
      values: *id001
  - name: section_size
    label: Section headings size (px)
    type: number
  - name: section_weight
    label: Section headings weight (400–900)
    type: number
  - name: section_color
    label: Section headings color (hex)
    type: string
  - name: body_size
    label: Body text and biographies size (px)
    type: number
  - name: body_weight
    label: Body text and biographies weight (400–900)
    type: number
  - name: body_leading
    label: Body line height (e.g. 1.75)
    type: number
  - name: body_color
    label: Body text and biographies color (hex)
    type: string
  - name: nav_weight
    label: Navigation weight (400–900)
    type: number
  - name: nav_tracking
    label: Navigation letter spacing (px)
    type: number
  - name: label_font
    label: Small labels font
    type: select
    options:
      values: *id001
  - name: label_size
    label: Small labels size (px)
    type: number
  - name: label_weight
    label: Small labels weight (400–900)
    type: number
  - name: label_tracking
    label: Small labels letter spacing (px)
    type: number
  - name: label_color
    label: Small labels color (hex)
    type: string
  - name: art_font
    label: Artwork information font
    type: select
    options:
      values: *id001
  - name: art_title_size
    label: Artwork title size (px)
    type: number
  - name: art_details_size
    label: Artwork details size (px)
    type: number
  - name: art_color
    label: Artwork information color (hex)
    type: string
  - name: research_font
    label: Research callout font
    type: select
    options:
      values: *id001
  - name: research_heading_size
    label: Research heading size (px)
    type: number
  - name: research_body_size
    label: Research copy size (px)
    type: number
  - name: research_background
    label: Research solid background (hex)
    type: string
  - name: research_color
    label: Research callout color (hex)
    type: string
  - name: footer_font
    label: Footer font
    type: select
    options:
      values: *id001
  - name: footer_size
    label: Footer size (px)
    type: number
  - name: footer_color
    label: Footer color (hex)
    type: string
  - name: body_font
    label: Body Font
    type: select
    options:
      values: *id001
  - name: accent_color
    label: Accent Color
    type: string
  - name: text_color
    label: Text Color
    type: string
  - name: page_background
    label: Page Background
    type: string
  - name: button_color
    label: Button Color
    type: string
  - name: button_text_color
    label: Button Text Color
    type: string
  - name: content_width
    label: Content Width
    type: number
  - name: section_spacing
    label: Section Spacing
    type: number
  - name: hero_banner
    label: Hero Banner
    type: image
  - name: hero_height
    label: Hero Height
    type: number
  - name: intro_background
    label: Intro Background
    type: string
  - name: event_background
    label: Event Background
    type: string
  - name: gallery_background
    label: Gallery Background
    type: string
  - name: gallery_hover_color
    label: Gallery Hover Overlay Color (hex, e.g.
    type: string
  - name: gallery_hover_opacity
    label: Gallery Hover Opacity (0 to 100)
    type: number
  - name: gallery_hover_text
    label: Gallery Hover Name Color (hex, e.g.
    type: string
  - name: gallery_sort
    label: Gallery Sort
    type: select
    options:
      values:
      - custom
      - newest
      - alphabetical
      - random
  - name: callout_rule_type
    label: Callout Rule Type
    type: select
    options:
      values:
      - solid
      - gradient
  - name: callout_rule_color
    label: Callout Rule Color
    type: string
  - name: callout_rule_end
    label: Callout Rule End
    type: string
  - name: callout_rule_width
    label: Callout Rule Width
    type: number
  - name: callout_gap
    label: Callout Gap
    type: number
  - name: divider_rule_type
    label: Divider Rule Type
    type: select
    options:
      values:
      - solid
      - gradient
  - name: divider_rule_color
    label: Divider Rule Color
    type: string
  - name: divider_rule_end
    label: Divider Rule End
    type: string
  - name: divider_rule_width
    label: Divider Rule Width
    type: number
  - name: favicon
    label: Favicon (square PNG recommended)
    type: image
  - name: social_nav_enabled
    label: Show social icons in navigation
    type: boolean
  - name: social_footer_enabled
    label: Show social icons in footer
    type: boolean
  - name: instagram_url
    label: Instagram profile URL
    type: string
  - name: bluesky_url
    label: Bluesky profile URL
    type: string
  - name: tiktok_url
    label: TikTok profile URL (optional)
    type: string
  - name: nav_rule_type
    label: Navigation bottom rule type
    type: select
    options:
      values:
      - solid
      - gradient
  - name: nav_rule_color
    label: Navigation rule start color
    type: string
  - name: nav_rule_end
    label: Navigation rule end color
    type: string
  - name: nav_rule_width
    label: Navigation rule thickness
    type: number
  - name: shop_url
    label: Shop Url
    type: string
- name: pages
  label: Site pages
  type: collection
  path: content/pages
  filename: '{primary}.md'
  view:
    fields:
    - title
    primary: title
  fields:
  - name: title
    label: Page title
    type: string
    required: true
  - name: subtitle
    label: Intro subtitle
    type: string
  - name: hero_image
    label: Header image (optional)
    type: image
  - name: body
    label: Page content
    type: rich-text
- name: events
  label: Exhibitions and events
  type: collection
  path: content/events
  filename: '{primary}.md'
  view:
    fields:
    - title
    - date
    - published
    primary: title
  fields:
  - name: title
    label: Event name
    type: string
    required: true
  - name: date
    label: Event date
    type: date
    required: true
  - name: location
    label: Location
    type: string
  - name: link
    label: Event link
    type: string
  - name: image
    label: Event image
    type: image
  - name: published
    label: Published
    type: boolean
    default: true
  - name: body
    label: Event description
    type: rich-text
