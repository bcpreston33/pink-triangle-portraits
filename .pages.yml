media:
  input: assets/uploads
  output: /assets/uploads
content:
- name: people
  label: Portraits & Biographies
  type: collection
  path: content/people
  filename: '{primary}.md'
  view:
    fields:
    - name
    - years
    primary: name
  fields:
  - name: name
    label: 01 · PERSON DETAILS | Person name
    type: string
    required: true
    description: 'Section: Person Details. These controls change this part of the website; leave existing values unchanged unless you want to adjust its appearance.'
  - name: years
    label: 01 · PERSON DETAILS | Life dates
    type: string
  - name: body
    label: 01 · PERSON DETAILS | Biography
    type: rich-text
  - name: artworks
    label: 02 · ARTWORK | Paintings (add one or more below)
    type: object
    list: true
    fields:
    - name: image
      label: Artwork image
      type: image
      required: true
    - name: medium
      label: Materials
      type: string
    - name: dimensions
      label: Size
      type: string
    - name: published
      label: Published
      type: boolean
      default: true
    - name: display_order
      label: Gallery position (lower numbers first)
      type: number
      default: 100
    - name: gallery_thumbnail
      label: Gallery thumbnail (optional square image)
      type: image
      description: Used only in the Portraits gallery. Leave empty to use the artwork image.
    description: 'Section: Artwork. These controls change this part of the website; leave existing values unchanged unless you want to adjust its appearance.'
  - name: homepage_teaser
    label: 03 · HOMEPAGE | Homepage teaser (100–200 characters)
    type: text
    description: Short text shown when this person is the latest portrait. Keep to about 100–200 characters.
  - name: featured_at
    label: 03 · HOMEPAGE | Portrait added date (automatic)
    description: Set automatically for new biographies. Determines the newest portrait on the homepage; leave existing dates unchanged when editing.
    type: date
  - name: homepage_override
    label: 03 · HOMEPAGE | Manually feature this person on homepage (optional)
    type: boolean
    default: false
    description: Normally the most recently added biography appears automatically. Check this to force a person instead; uncheck to return to automatic. If multiple are checked, the newest portrait-added date wins.
  - name: sources
    label: 04 · SOURCES | Further reading & sources
    type: rich-text
    description: 'Section: Sources. These controls change this part of the website; leave existing values unchanged unless you want to adjust its appearance.'
  - name: special_thanks
    label: 04 · SOURCES | Special thanks & acknowledgments
    type: rich-text
- name: press
  label: Press & Media
  type: collection
  path: content/press
  filename: '{primary}.md'
  view:
    fields:
    - title
    - publication
    - date
    primary: title
  fields:
  - name: title
    label: 01 · ARTICLE DETAILS | Article headline
    description: Appears on The Project page and in the automatic homepage press feature.
    type: string
    required: true
  - name: publication
    label: 01 · ARTICLE DETAILS | Publication or outlet
    description: The publisher name shown above the article headline.
    type: string
  - name: date
    label: 01 · ARTICLE DETAILS | Publication date
    description: Used to sort articles and determine when they rotate off the homepage.
    type: date
  - name: summary
    label: 01 · ARTICLE DETAILS | Short description
    description: Appears below the headline and in the homepage feature. Keep it brief.
    type: text
  - name: url
    label: 01 · ARTICLE DETAILS | Link to article / recording
    description: The external page opened when visitors select this feature.
    type: string
  - name: link_label
    label: 01 · ARTICLE DETAILS | Link text (optional)
    type: string
  - name: logo
    label: 02 · IMAGES | Publication logo (optional)
    type: image
    description: Preferred over thumbnails and automatic logos. Leave empty to use automatic detection.
  - name: image
    label: 02 · IMAGES | Article thumbnail (optional)
    type: image
    description: Used in the Project page and lower press list if no custom logo is supplied. For a homepage screenshot, use the separate Homepage spotlight field below.
  - name: homepage_image
    label: 02 · IMAGES | Homepage article screenshot (optional)
    type: image
    description: Only the rotating homepage press feature uses this image, inside the browser-style banner. Upload a screenshot of the article here. The Project page and lower press list continue using the publication logo or article thumbnail. Leave empty to use those existing images automatically.
  - name: hide_image
    label: 02 · IMAGES | Hide image for this article
    type: boolean
    default: false
    description: Hides the logo/thumbnail for this article even when images are enabled on The Project page.
  - name: press_pin
    label: 03 · HOMEPAGE & PUBLISHING | Pin this article above newer coverage (optional)
    type: boolean
    default: false
    description: Normally all coverage sorts newest first. Turn on only for a major article you want to keep ahead of newer stories on The Project page and the homepage. A pinned article also stays in the temporary top homepage feature.
  - name: homepage_days
    label: 03 · HOMEPAGE & PUBLISHING | Top homepage feature duration (days, optional)
    type: number
    description: Leave blank to use the default of 30 days from publication. Applies to the temporary top homepage feature only.
  - name: published
    label: 03 · HOMEPAGE & PUBLISHING | Publish this press item
    description: Turn off to hide this item from all public press sections.
    type: boolean
    default: true
- name: events
  label: Exhibitions & Talks
  type: collection
  path: content/events
  filename: '{primary}.md'
  view:
    fields: [title, date, published]
    primary: title
  fields:
  - name: title
    label: 01 · EVENT DETAILS | Title
    type: string
    required: true
    description: 'Section: Event Details. These controls change this part of the website; leave existing values unchanged unless you want to adjust its appearance.'
  - name: event_type
    label: 01 · EVENT DETAILS | Event type
    type: select
    options:
      values:
      - label: Artist Talk
        value: talk
      - label: Talk & Presentation
        value: presentation
      - label: Gallery Exhibition
        value: exhibition
      - label: Gallery Exhibition + Talk/Reception
        value: exhibition_talk
      - label: Online / Media Appearance
        value: online
    default: talk
    description: Choose a format. Talk and presentation are one-day events. Gallery shows use an end date. Online appearances use the release date and media links, without a venue or time.
  - name: body
    label: 01 · EVENT DETAILS | Short event description
    type: rich-text
    description: A sentence or two describing the event. Also used in the event listing.
  - name: venue
    label: 01 · EVENT DETAILS | Venue name
    type: string
  - name: address
    label: 01 · EVENT DETAILS | Venue street address (in-person only)
    type: string
  - name: location
    label: 01 · EVENT DETAILS | Location fallback (optional)
    type: string
    description: Used only if no street address is supplied. Existing events retain this value.
  - name: date
    label: 02 · DATES & TIMES | Event date / exhibition opening
    type: date
    description: Required for new events. Historical archive entries can use a year instead.
  - name: end_date
    label: 02 · DATES & TIMES | Exhibition closing date (ONLY for gallery shows)
    type: string
    description: Enter YYYY-MM-DD, or leave blank. Leave BLANK for talks, presentations, and online appearances. Only fill for gallery exhibitions; must be on or after the opening date.
  - name: event_time
    label: 02 · DATES & TIMES | Talk / presentation start time
    type: string
    description: For example 12:00 PM. For a one-day event; leave blank for a gallery-only exhibition.
  - name: event_end_time
    label: 02 · DATES & TIMES | Talk / presentation end time (optional)
    type: string
    description: For example 2:00 PM.
  - name: reception_date
    label: 02 · DATES & TIMES | Additional talk/reception date
    type: string
    description: Enter YYYY-MM-DD, or leave blank. Only for an additional talk or reception DURING a gallery exhibition. Leave blank otherwise.
  - name: reception
    label: 02 · DATES & TIMES | Additional talk/reception label (gallery + talk only)
    type: string
    description: For example Opening reception, Artist talk, or Artist talk and reception. Leave blank if none.
  - name: artist_talk_date
    label: 02 · DATES & TIMES | LEGACY ONLY · Old artist talk date (do not use)
    type: string
    description: Enter YYYY-MM-DD, or leave blank. Retained for compatibility. Do not fill this field for new events.
  - name: artist_talk_time
    label: 02 · DATES & TIMES | Additional talk/reception start time (gallery + talk only)
    type: string
    description: For example 6:00 PM. Only for a gallery with an additional talk/reception.
  - name: special_end_time
    label: 02 · DATES & TIMES | Additional talk/reception end time (optional)
    type: string
  - name: hours
    label: 02 · DATES & TIMES | Gallery visiting hours (gallery shows only)
    type: string
  - name: image
    label: 03 · IMAGE & LINKS | Event flyer / image
    type: image
    description: Shown beside upcoming event details. Visitors can click to view the full-size flyer.
  - name: learn_more_url
    label: 03 · IMAGE & LINKS | Learn More link (optional)
    type: string
  - name: watch_url
    label: 03 · IMAGE & LINKS | Watch Here link (optional)
    type: string
  - name: listen_url
    label: 03 · IMAGE & LINKS | Listen Here link (optional)
    type: string
  - name: link
    label: 03 · IMAGE & LINKS | Other event link (optional)
    type: string
  - name: published
    label: 04 · DISPLAY & HOMEPAGE | Published
    type: boolean
    default: true
    description: 'Section: Display & Homepage. These controls change this part of the website; leave existing values unchanged unless you want to adjust its appearance.'
  - name: homepage_feature
    label: 04 · DISPLAY & HOMEPAGE | Show automatically on homepage
    type: boolean
    default: true
    description: Automatically promotes upcoming events, then removes them when finished.
  - name: featured
    label: 04 · DISPLAY & HOMEPAGE | Legacy featured setting (no longer needed)
    type: boolean
    default: false
  - name: featured_order
    label: 04 · DISPLAY & HOMEPAGE | Legacy featured order (no longer needed)
    type: number
    default: 10
  - name: listing_title
    label: 04 · DISPLAY & HOMEPAGE | Archive listing title override (optional)
    type: string
  - name: listing_description
    label: 04 · DISPLAY & HOMEPAGE | Archive listing description override (optional)
    type: string
  - name: homepage_description
    label: 04 · DISPLAY & HOMEPAGE | Homepage description override (optional)
    type: string
  - name: archive_only
    label: 05 · ARCHIVE SETTINGS | Historical year-only entry
    type: boolean
    default: false
    description: Use for older talks and shows when the exact date is unknown.
  - name: archive_year
    label: 05 · ARCHIVE SETTINGS | Historical year (year-only entries)
    type: number
  - name: archive_order
    label: 05 · ARCHIVE SETTINGS | Historical order (lower first)
    type: number
- name: page_the_project
  label: The Project
  type: file
  path: content/pages/the-project.md
  fields:
  - name: title
    label: 01 · PAGE HEADER | Page title
    type: string
    required: true
  - name: subtitle
    label: 01 · PAGE HEADER | Intro subtitle
    type: text
    description: Press Enter for a desktop line break. On mobile the text wraps naturally.
  - name: hero_image
    label: 01 · PAGE HEADER | Desktop image (1200 × 400 px)
    description: Desktop page banner image. Recommended 1200 × 400 px. This changes only this page.
    type: image
  - name: hero_mobile_image
    label: 01 · PAGE HEADER | Mobile image (optional)
    description: Optional artwork-only mobile crop, shown beneath the title. If blank, the desktop header image is used.
    type: image
  - name: body
    label: 02 · MAIN CONTENT | Page text
    type: rich-text
    description: Main editable page content. This is the long text shown beneath the page banner.
  - name: project_sidebar_enabled
    label: 04 · THE PROJECT PAGE ONLY | Show right-hand content column
    description: Only affects The Project page. Turn off to return to the original full-width editorial layout and press section below.
    type: boolean
    default: true
  - name: project_sidebar_image
    label: 04 · THE PROJECT PAGE ONLY | Right column header artwork (optional)
    type: image
    description: Optional wide painted image at the top of the right column. Independent of the page header and supporting images.
  - name: project_sidebar_image_alt
    label: 04 · THE PROJECT PAGE ONLY | Right column image description
    type: string
  - name: project_sidebar_heading
    label: 04 · THE PROJECT PAGE ONLY | Right column heading (optional)
    type: string
  - name: project_sidebar_body
    label: 04 · THE PROJECT PAGE ONLY | Right column editable text
    type: rich-text
    description: Ordinary paragraphs, headings, bold, italics and links. Leave blank to show only the press section.
  - name: project_sidebar_callout
    label: 04 · THE PROJECT PAGE ONLY | Right column highlight text (optional)
    type: rich-text
    description: Separate highlighted text block above Press & Media. Leave blank to hide.
  - name: project_sidebar_press_enabled
    label: 04 · THE PROJECT PAGE ONLY | Show Press & Media in right column
    type: boolean
    default: true
  - name: project_sidebar_press_heading
    label: 04 · THE PROJECT PAGE ONLY | Press section heading
    type: string
    default: Press & Media
  - name: project_sidebar_press_intro
    label: 04 · THE PROJECT PAGE ONLY | Press introduction (optional)
    type: rich-text
  - name: project_sidebar_press_limit
    label: 04 · THE PROJECT PAGE ONLY | Number of press items (0 shows all)
    type: number
    default: 0
    description: Shows newest first. Set to 0 to include every published article.
  - name: project_press_show_images
    label: 04 · THE PROJECT PAGE ONLY | Show press logos / thumbnails
    description: Shows one image per article, prioritizing your uploaded logo, then an article thumbnail or automatic image.
    type: boolean
    default: true
  - name: project_press_image_width
    label: 04 · THE PROJECT PAGE ONLY | Logo / thumbnail width (pixels)
    type: number
    default: 95
  - name: project_press_title_font
    label: 04 · PROJECT ONLY | Press article headline font (not History)
    type: string
    default: DM Sans
    description: Press article headline font on The Project only. Enter DM Sans, Barlow Condensed, or Georgia.
  - name: project_press_title_size
    label: 04 · PROJECT ONLY | Press article headline size (not History)
    type: number
    default: 19
  - name: project_press_title_weight
    label: 04 · PROJECT ONLY | Press article headline weight (not History)
    description: 'Press article headline weight on The Project only: 400, 500, 600, or 700.'
    type: string
    default: '600'
  - name: project_press_rule_color
    label: 04 · THE PROJECT PAGE ONLY | Article divider color (hex)
    description: Thin horizontal line between press articles. Example color is
    type: string
    default: '#d7d7d7'
  - name: project_press_rule_spacing
    label: 04 · THE PROJECT PAGE ONLY | Divider spacing (pixels)
    description: Controls the space above and below each press article divider.
    type: number
    default: 18
  - name: supporting_images
    label: 05 · PAGE EXTRAS | Supporting images beside sections
    type: object
    list: true
    description: Add an image and match its section heading exactly (for example, Where it began). Leave caption empty to show no caption.
    fields:
    - name: section_heading
      label: Related section heading (exact wording)
      type: string
      required: true
      description: Match a heading in Page content, without the
    - name: image
      label: Supporting image
      type: image
      required: true
    - name: caption
      label: Small caption (optional)
      type: string
    - name: alt_text
      label: Image description for accessibility
      type: string
    - name: placement
      label: Image placement
      type: select
      default: right
      options:
        values:
        - label: Right column
          value: right
        - label: Left column
          value: left
        - label: Full width below section (explicit only)
          value: full
  - name: callouts
    label: 06 · PAGE EXTRAS | Quotes, callouts & featured statements
    type: object
    list: true
    description: Add blocks in order. For exact inline placement, put [callout-1], [callout-2], etc. in Page content, matching their order here. Otherwise choose a section and placement.
    fields:
    - name: style
      label: Style
      type: select
      default: quote
      options:
        values:
        - label: Pull Quote (10px left rule)
          value: quote
        - label: Highlight / Callout
          value: highlight
        - label: Featured Statement (thin horizontal rules)
          value: statement
    - name: heading
      label: Optional heading
      type: string
    - name: text
      label: Quote or callout text
      type: text
      description: Use **bold**, *italic*, or ***bold italic***. Blank lines create paragraphs.
      required: true
    - name: attribution
      label: Attribution / source (optional)
      type: string
    - name: section_heading
      label: Related section heading (exact wording)
      type: string
      description: Match a heading in Page content. Not needed when using an inline [callout-N] marker.
    - name: position
      label: Position within section
      type: select
      default: after-heading
      options:
        values:
        - label: Before section
          value: before-section
        - label: After heading
          value: after-heading
        - label: After section text
          value: after-section
    - name: layout
      label: Layout
      type: select
      default: text
      options:
        values:
        - label: Text column
          value: text
        - label: Side image area
          value: side
        - label: Full width below section (explicit only)
          value: full
    - name: alignment
      label: Text alignment
      type: select
      default: left
      options:
        values:
        - label: Left
          value: left
        - label: Center
          value: center
        - label: Right
          value: right
