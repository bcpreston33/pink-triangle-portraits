- name: events
  label: Exhibitions and events
  type: collection
  path: content/events
  filename: '{primary}.md'
  view:
    fields:
    - title
    - date
    - published
    primary: title
  fields:
  - name: title
    label: Event name
    type: string
    required: true
  - name: date
    label: Event opening / start date
    description: Required for automatic upcoming/past grouping and homepage promotion.
    type: date
    required: true
  - name: end_date
    label: Event end date (optional)
    type: date
    description: If blank, event is treated as a one-day event. Once this date passes it moves to Previous Exhibitions.
  - name: location
    label: Location (short display line)
    type: string
    description: A short location such as Boston, MA; shown in lists and on the homepage.
  - name: venue
    label: Venue / gallery name
    type: string
    description: Displayed in the featured event card. Leave blank if the short location is enough.
  - name: address
    label: Venue address (optional)
    type: string
    description: Street address or full location, displayed below the venue.
  - name: reception
    label: Opening reception (optional)
    type: string
    description: For example Friday, April 9, 6–8 PM. Shown on the featured card.
  - name: hours
    label: Gallery hours (optional)
    type: string
    description: Visiting hours for the featured exhibition.
  - name: featured_order
    label: Featured display order (lower number first)
    type: number
    default: 10
    description: When multiple shows are featured, lower numbers appear first in the right column.
  - name: link
    label: Event link
    type: string
    description: External event or venue details; leave blank to link to the Exhibitions page from the homepage.
  - name: image
    label: Exhibition poster or featured image
    type: image
    description: Used on the Exhibitions featured card and homepage. A tall poster works well.
  - name: homepage_feature
    label: Allow this event to appear automatically on homepage
    type: boolean
    default: true
    description: Automatically shows within the homepage lead time and disappears after the event ends.
  - name: featured
    label: Feature prominently on Exhibitions page
    type: boolean
    default: false
    description: Show a tall image-and-details card in the right column while the event is upcoming or underway. It also
      stays in the left chronological list.
  - name: published
    label: Published
    type: boolean
    default: true
  - name: body
    label: Event description
    type: rich-text
    description: Full event information displayed in the featured card and historical listing. Do not duplicate an event
      in the Exhibitions page body.
