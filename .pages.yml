- name: page_the_project
  label: The Project · Page content & design
  type: file
  path: content/pages/the-project.md
  fields:
  - name: title
    label: 01 · PAGE HEADER | Page title
    type: string
    required: true
  - name: subtitle
    label: 01 · PAGE HEADER | Intro subtitle
    type: text
    description: Press Enter for a desktop line break. On mobile the text wraps naturally.
  - name: hero_image
    label: 01 · PAGE HEADER | Desktop image (1200 × 400 px)
    description: Desktop page banner image. Recommended 1200 × 400 px. This changes only this page.
    type: image
  - name: hero_mobile_image
    label: 01 · PAGE HEADER | Mobile image (optional)
    description: Optional artwork-only mobile crop, shown beneath the title. If blank, the desktop header image is used.
    type: image
  - name: body
    label: 02 · MAIN CONTENT | Page text
    type: rich-text
    description: Main editable page content. This is the long text shown beneath the page banner.
  - name: project_sidebar_enabled
    label: 04 · THE PROJECT PAGE ONLY | Show right-hand content column
    description: Only affects The Project page. Turn off to return to the original full-width editorial layout and press
      section below.
    type: boolean
    default: true
  - name: project_sidebar_image
    label: 04 · THE PROJECT PAGE ONLY | Right column header artwork (optional)
    type: image
    description: Optional wide painted image at the top of the right column. Independent of the page header and supporting
      images.
  - name: project_sidebar_image_alt
    label: 04 · THE PROJECT PAGE ONLY | Right column image description
    type: string
  - name: project_sidebar_heading
    label: 04 · THE PROJECT PAGE ONLY | Right column heading (optional)
    type: string
  - name: project_sidebar_body
    label: 04 · THE PROJECT PAGE ONLY | Right column editable text
    type: rich-text
    description: Ordinary paragraphs, headings, bold, italics and links. Leave blank to show only the press section.
  - name: project_sidebar_callout
    label: 04 · THE PROJECT PAGE ONLY | Right column highlight text (optional)
    type: rich-text
    description: Separate highlighted text block above Press & Media. Leave blank to hide.
  - name: project_sidebar_press_enabled
    label: 04 · THE PROJECT PAGE ONLY | Show Press & Media in right column
    type: boolean
    default: true
  - name: project_sidebar_press_heading
    label: 04 · THE PROJECT PAGE ONLY | Press section heading
    type: string
    default: Press & Media
  - name: project_sidebar_press_intro
    label: 04 · THE PROJECT PAGE ONLY | Press introduction (optional)
    type: rich-text
  - name: project_sidebar_press_limit
    label: 04 · THE PROJECT PAGE ONLY | Number of press items (0 shows all)
    type: number
    default: 0
    description: Shows newest first. Set to 0 to include every published article.
  - name: project_press_show_images
    label: 04 · THE PROJECT PAGE ONLY | Show press logos / thumbnails
    description: Shows one image per article, prioritizing your uploaded logo, then an article thumbnail or automatic
      image.
    type: boolean
    default: true
  - name: project_press_image_width
    label: 04 · THE PROJECT PAGE ONLY | Logo / thumbnail width (pixels)
    type: number
    default: 95
  - name: project_press_title_font
    label: 04 · PROJECT ONLY | Press article headline font (not History)
    type: string
    default: DM Sans
    description: Press article headline font on The Project only. Enter DM Sans, Barlow Condensed, or Georgia.
  - name: project_press_title_size
    label: 04 · PROJECT ONLY | Press article headline size (not History)
    type: number
    default: 19
  - name: project_press_title_weight
    label: 04 · PROJECT ONLY | Press article headline weight (not History)
    description: 'Press article headline weight on The Project only: 400, 500, 600, or 700.'
    type: string
    default: '600'
  - name: project_press_rule_color
    label: 04 · THE PROJECT PAGE ONLY | Article divider color (hex)
    description: Thin horizontal line between press articles. Example color is
    type: string
    default: '#d7d7d7'
  - name: project_press_rule_spacing
    label: 04 · THE PROJECT PAGE ONLY | Divider spacing (pixels)
    description: Controls the space above and below each press article divider.
    type: number
    default: 18
  - name: supporting_images
    label: 05 · PAGE EXTRAS | Supporting images beside sections
    type: object
    list: true
    description: Add an image and match its section heading exactly (for example, Where it began). Leave caption empty
      to show no caption.
    fields:
    - name: section_heading
      label: Related section heading (exact wording)
      type: string
      required: true
      description: Match a heading in Page content, without the
    - name: image
      label: Supporting image
      type: image
      required: true
    - name: caption
      label: Small caption (optional)
      type: string
    - name: alt_text
      label: Image description for accessibility
      type: string
    - name: placement
      label: Image placement
      type: select
      default: right
      options:
        values:
        - label: Right column
          value: right
        - label: Left column
          value: left
        - label: Full width below section (explicit only)
          value: full
  - name: callouts
    label: 06 · PAGE EXTRAS | Quotes, callouts & featured statements
    type: object
    list: true
    description: Add blocks in order. For exact inline placement, put [callout-1], [callout-2], etc. in Page content,
      matching their order here. Otherwise choose a section and placement.
    fields:
    - name: style
      label: Style
      type: select
      default: quote
      options:
        values:
        - label: Pull Quote (10px left rule)
          value: quote
        - label: Highlight / Callout
          value: highlight
        - label: Featured Statement (thin horizontal rules)
          value: statement
    - name: heading
      label: Optional heading
      type: string
    - name: text
      label: Quote or callout text
      type: text
      description: Use **bold**, *italic*, or ***bold italic***. Blank lines create paragraphs.
      required: true
    - name: attribution
      label: Attribution / source (optional)
      type: string
    - name: section_heading
      label: Related section heading (exact wording)
      type: string
      description: Match a heading in Page content. Not needed when using an inline [callout-N] marker.
    - name: position
      label: Position within section
      type: select
      default: after-heading
      options:
        values:
        - label: Before section
          value: before-section
        - label: After heading
          value: after-heading
        - label: After section text
          value: after-section
    - name: layout
      label: Layout
      type: select
      default: text
      options:
        values:
        - label: Text column
          value: text
        - label: Side image area
          value: side
        - label: Full width below section (explicit only)
          value: full
    - name: alignment
      label: Text alignment
      type: select
      default: left
      options:
        values:
        - label: Left
          value: left
        - label: Center
          value: center
        - label: Right
          value: right
